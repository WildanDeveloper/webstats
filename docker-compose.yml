services:
  db:
    image: postgres:16-alpine
    container_name: webstats-db
    environment:
      POSTGRES_USER: webstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique random hex password}
      POSTGRES_DB: webstats
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstats"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webstats-redis
    profiles: ["queue"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  migrate:
    image: postgres:16-alpine
    container_name: webstats-migrate
    profiles: ["full", "queue"]
    volumes:
      - ./db/migrations:/migrations:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: webstats
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique random hex password}
      PGDATABASE: webstats
    entrypoint: >
      sh -c 'for f in /migrations/*.sql; do
        echo "applying $$(basename $$f)";
        psql -v ON_ERROR_STOP=1 -q -f "$$f" || exit 1;
      done; echo "migrations done"'
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: ./backend
    container_name: webstats-ingest
    profiles: ["full", "queue"]
    environment:
      PORT: "8085"
      DATABASE_URL: postgres://webstats:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique random hex password}@db:5432/webstats
      GEO_CSV: /app/data/geo.csv
      GEO_ASN_CSV: /app/data/asn.csv
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique random 32-byte hex secret}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT to a unique random 32-byte hex salt}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ./backend
    container_name: webstats-dashboard
    profiles: ["full"]
    entrypoint: ["/usr/local/bin/dashboard"]
    environment:
      PORT: "8086"
      DATABASE_URL: postgres://webstats:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique random hex password}@db:5432/webstats
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique random 32-byte hex secret}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT to a unique random 32-byte hex salt}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8086}
      ALLOW_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:8086}
        NEXT_PUBLIC_TRACKER_URL: ${NEXT_PUBLIC_TRACKER_URL:-http://localhost:8085}
    container_name: webstats-web
    profiles: ["full"]
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET to a unique random 32-byte hex secret}
      NEXTAUTH_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_SERVER_URL: http://dashboard:8086
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - dashboard

  worker:
    build: ./backend
    container_name: webstats-worker
    profiles: ["queue"]
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: postgres://webstats:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique random hex password}@db:5432/webstats
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique random 32-byte hex secret}
      IP_HASH_SALT: ${IP_HASH_SALT:?Set IP_HASH_SALT to a unique random 32-byte hex salt}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
