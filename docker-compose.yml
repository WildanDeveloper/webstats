services:
  db:
    image: postgres:16-alpine
    container_name: webstats-db
    environment:
      POSTGRES_USER: webstats
      POSTGRES_PASSWORD: webstats
      POSTGRES_DB: webstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstats"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webstats-redis
    profiles: ["queue"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  migrate:
    image: postgres:16-alpine
    container_name: webstats-migrate
    profiles: ["full", "queue"]
    volumes:
      - ./db/migrations:/migrations:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: webstats
      PGPASSWORD: webstats
      PGDATABASE: webstats
    entrypoint: >
      sh -c 'for f in /migrations/*.sql; do
        echo "applying $$(basename $$f)";
        psql -v ON_ERROR_STOP=1 -q -f "$$f" || exit 1;
      done; echo "migrations done"'
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: ./backend
    container_name: webstats-ingest
    profiles: ["full"]
    environment:
      PORT: "8085"
      DATABASE_URL: postgres://webstats:webstats@db:5432/webstats
      GEO_CSV: /app/data/geo.csv
      GEO_ASN_CSV: /app/data/asn.csv
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ./backend
    container_name: webstats-dashboard
    profiles: ["full"]
    command: ["/usr/local/bin/dashboard"]
    environment:
      PORT: "8086"
      DATABASE_URL: postgres://webstats:webstats@db:5432/webstats
      JWT_SECRET: change-me-in-production
      APP_PUBLIC_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8086
    ports:
      - "8086:8086"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    container_name: webstats-web
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8086
        NEXT_PUBLIC_TRACKER_URL: http://localhost:8085
    ports:
      - "3000:3000"
    depends_on:
      - dashboard

  worker:
    build: ./backend
    container_name: webstats-worker
    profiles: ["queue"]
    command: ["/usr/local/bin/worker"]
    environment:
      DATABASE_URL: postgres://webstats:webstats@db:5432/webstats
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
